name: macOS (arm64)

# Tests on every push and pull request; the Apple Silicon distribution on a tag
# (v*) or by hand. Both on a native macOS runner.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the bundle to a GitHub release for this tag (e.g. v2.28.2). Empty = artifact only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-14 # Apple Silicon
    env:
      # Every target is warning-free since the crate-wide allow went; keep it so.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup set profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64-test

      - name: Test
        run: cargo test --locked --bin ag_unlocker --target aarch64-apple-darwin

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup set profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      # The same script as a local build, so the two cannot drift.
      - name: Build and assemble
        id: pack
        run: |
          mkdir -p dist
          macos/build.sh --out dist | tee build.out
          grep -E '^(version|name|tgz|app_zip|dmg)=' build.out >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.dmg }}
            ${{ steps.pack.outputs.app_zip }}
            ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error

      - name: Attach to release
        # On a tag push, or when a tag was given to workflow_dispatch.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: |
          gh release upload "$TAG" "${{ steps.pack.outputs.dmg }}" "${{ steps.pack.outputs.app_zip }}" \
            "${{ steps.pack.outputs.tgz }}" \
            --clobber --repo "$GITHUB_REPOSITORY"
