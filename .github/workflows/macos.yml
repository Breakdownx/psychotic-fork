name: macOS

# Tests on every push and pull request; the macOS distribution on a tag (v*) or
# by hand, published as a GitHub release with the DMG attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the build as the GitHub release for this tag (e.g. v2.35.2). Empty = workflow artifact only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    # Apple Silicon. A pinned image (macos-14) is retired sooner or later, and a
    # retired one cancels every run before a step starts.
    runs-on: macos-latest
    env:
      # Every target is warning-free since the crate-wide allow went; keep it so.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup set profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-test

      - name: Test
        run: cargo test --locked --bin ag_unlocker --target aarch64-apple-darwin

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Before the ten-minute build, not after it: a tag that disagrees with
      # Cargo.toml would publish a binary that calls itself another version.
      #
      # Two shapes: v2.35.1 - the release that goes with Antigravity 2.35.1,
      # the version in Cargo.toml - and v2.35.1_1, _2, ... - fixes of the
      # unlocker in between, Cargo.toml unchanged. The full version reaches the
      # binary (window title, update check) through AG_FULL_VERSION (build.rs).
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          FULL=${TAG#v}
          if [ "$FULL" != "$VER" ] && ! [[ "$FULL" =~ ^${VER//./\\.}_[0-9]+$ ]]; then
            echo "::error::Тег $TAG не подходит к версии $VER из Cargo.toml: нужен v$VER или v${VER}_<число> (например v${VER}_1). Для новой версии Antigravity поднимите version в Cargo.toml (и Cargo.lock)."
            exit 1
          fi
          echo "AG_FULL_VERSION=$FULL" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          rustup set profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release

      # The same script as a local build, so the two cannot drift.
      - name: Build and assemble
        id: pack
        env:
          # The window offers this repository's releases (src/update.rs).
          AG_RELEASES_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          macos/build.sh --out dist | tee build.out
          grep -E '^(version|name|tgz|app_zip|dmg)=' build.out >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.dmg }}
            ${{ steps.pack.outputs.app_zip }}
            ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error

      # The Windows workflow attaches its exe to the same release, and either
      # may come first: whichever finds no release creates it, empty and with
      # the shared notes (.github/release-notes.md), and each then uploads its
      # own files. Created empty because a create with files is a draft until
      # the upload ends - invisible to the other workflow, which would make a
      # second one.
      - name: Publish the release
        # On a tag push, or when a tag was given to workflow_dispatch. Creates the
        # release when the tag has none yet, otherwise replaces its files.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Antigravity Unlocker $VERSION" --notes-file .github/release-notes.md \
              || echo "[INFO] Релиз $TAG не создан - вероятно, его только что создал workflow Windows. Добавляю файлы."
          fi
          gh release upload "$TAG" "${{ steps.pack.outputs.dmg }}" "${{ steps.pack.outputs.app_zip }}" "${{ steps.pack.outputs.tgz }}" \
            --clobber --repo "$GITHUB_REPOSITORY"
